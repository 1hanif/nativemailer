name: Build & Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    env:
      NATIVEPHP_UPDATER_ENABLED: true
      NATIVEPHP_UPDATER_PROVIDER: github
      GITHUB_OWNER: projecthanif
      GITHUB_REPO: nativemailer
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, zip, pdo_sqlite, fileinfo, curl, dom, xml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Install JS dependencies & build assets
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        shell: bash
        run: |
          cp .env.example .env
          php artisan key:generate
          # Use the tag (without the leading "v") as the app version
          echo "NATIVEPHP_APP_VERSION=${GITHUB_REF_NAME#v}" >> .env

      - name: Build native app
        run: php artisan native:build ${{ matrix.platform }}

      # The mac build is unsigned: the main binary is ad-hoc signed by the linker while
      # Electron Framework keeps its own signature, and the hardened runtime then refuses
      # to load it ("different Team IDs"). Re-sign the whole bundle ad-hoc (without the
      # hardened runtime) so every binary shares one identity, then repackage.
      - name: Re-sign macOS app ad-hoc & repackage
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          cd nativephp/electron/dist

          APP=$(find . -maxdepth 2 -name '*.app' -type d | head -n 1)
          [ -n "$APP" ] || { echo "No .app bundle found"; exit 1; }
          APP_NAME=$(basename "$APP")
          echo "Re-signing $APP"

          xattr -cr "$APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          # Rebuild the zip (ditto keeps the framework symlinks intact)
          for ZIP in *.zip; do
            rm -f "$ZIP"
            ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          done

          # Rebuild the dmg with the usual drag-to-Applications layout
          for DMG in *.dmg; do
            STAGE=$(mktemp -d)
            ditto "$APP" "$STAGE/$APP_NAME"
            ln -s /Applications "$STAGE/Applications"
            rm -f "$DMG"
            hdiutil create -volname "${APP_NAME%.app}" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
            rm -rf "$STAGE"
          done

          # The old blockmaps no longer match; the updater falls back to a full download
          rm -f *.zip.blockmap *.dmg.blockmap

          # Point latest-mac.yml at the new hashes/sizes so auto-update verification passes
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const file = "latest-mac.yml";
            if (!fs.existsSync(file)) process.exit(0);
            const info = f => ({
              sha512: crypto.createHash("sha512").update(fs.readFileSync(f)).digest("base64"),
              size: fs.statSync(f).size,
            });
            let current = null;
            const out = fs.readFileSync(file, "utf8").split("\n").map(line => {
              const m = line.match(/^(\s*(?:- )?)(url|path|sha512|size):\s*(.*)$/);
              if (!m) return line;
              const [, indent, key, value] = m;
              if (key === "url" || key === "path") { current = fs.existsSync(value) ? info(value) : null; return line; }
              return current ? `${indent}${key}: ${current[key]}` : line;
            });
            fs.writeFileSync(file, out.join("\n"));
          '
          cat latest-mac.yml || true

      - name: List build output
        shell: bash
        run: ls -la nativephp/electron/dist/ || true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            nativephp/electron/dist/*.dmg
            nativephp/electron/dist/*.zip
            nativephp/electron/dist/*.exe
            nativephp/electron/dist/*.AppImage
            nativephp/electron/dist/*.deb
            nativephp/electron/dist/*.yml
            nativephp/electron/dist/*.blockmap
